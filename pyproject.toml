[project]
name = "controlled-web-ingestion"
version = "0.0.0"
description = "Policy-bound, evidence-driven controlled web ingestion"
requires-python = ">=3.12"
dependencies = [
  "crawl4ai>=0.9.1",
  "crawlee[playwright]>=1.8.1",
  "scrapy>=2.17.0",
  "trafilatura>=2.1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
web-ingest = "web_ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_ingestion"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-reportlog>=1.0.0"]
