min_version = "2026.10.10"
[settings]
locked = true
not_found_system_fallback = false
idiomatic_version_file_enable_tools = []
[tools]
cue = "0.17.1"
node = "26.12.0"
"npm:prettier" = "3.9.10"
python = "3.14.8"
ruff = "0.17.1"
taplo = "0.10.0"
uv = "0.13.1"
"github:gitleaks/gitleaks" = "8.30.1"
[tasks.bootstrap]
description = "Install the locked tools and synchronize the locked Python environment"
run = ["mise install --locked", "uv sync --locked"]
[tasks.check]
description = "Run every repository check without changing files"
run = [
  "uv run --locked python tools/ci/run_tests.py",
  "uv run --locked python tools/ci/validate_schemas.py",
  "uv run --locked python tools/ci/check_documentation.py",
  "uv run --locked python tools/ci/check_source_topology.py",
  "uv run --locked python tools/ci/project.py --check",
  "prettier --config .config/checks/prettier/prettier.toml --ignore-path .gitignore --ignore-path .config/checks/prettier/prettierignore --check '**/*.{md,yaml,yml}'",
  "taplo fmt --config .config/checks/taplo/taplo.toml --check",
  "ruff format --config .config/checks/ruff/ruff.toml --no-cache --check .",
  "gitleaks git --no-banner --redact=100 --exit-code 1 .",
]
[tasks.fix]
description = "Regenerate both Forge pipelines and apply the repository formatters"
run = [
  "uv run --locked python tools/ci/project.py --write",
  "prettier --config .config/checks/prettier/prettier.toml --ignore-path .gitignore --ignore-path .config/checks/prettier/prettierignore --write '**/*.{md,yaml,yml}'",
  "taplo fmt --config .config/checks/taplo/taplo.toml",
  "ruff format --config .config/checks/ruff/ruff.toml --no-cache .",
]
