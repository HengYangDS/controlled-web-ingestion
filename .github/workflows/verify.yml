name: Verify
"on":
  push:
    branches:
      - main
      - candidate/**
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  python-contracts:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
          version: 0.13.4
      - name: Report the selected Python
        env:
          UV_NO_MANAGED_PYTHON: "1"
          UV_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/uv
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/build/runtime/venv/python-${{ matrix.python-version }}
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: uv run --locked --python python python --version
      - name: Run the tests check
        env:
          UV_NO_MANAGED_PYTHON: "1"
          UV_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/uv
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/build/runtime/venv/python-${{ matrix.python-version }}
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: uv run --locked --python python python tools/ci/run_tests.py
      - name: Run the schemas check
        env:
          UV_NO_MANAGED_PYTHON: "1"
          UV_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/uv
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/build/runtime/venv/python-${{ matrix.python-version }}
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: uv run --locked --python python python tools/ci/validate_schemas.py
      - name: Run the documents check
        env:
          UV_NO_MANAGED_PYTHON: "1"
          UV_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/uv
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/build/runtime/venv/python-${{ matrix.python-version }}
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: uv run --locked --python python python tools/ci/check_documentation.py
      - name: Run the topology check
        env:
          UV_NO_MANAGED_PYTHON: "1"
          UV_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/uv
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/build/runtime/venv/python-${{ matrix.python-version }}
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: uv run --locked --python python python tools/ci/check_source_topology.py
  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run the pinned Gitleaks action
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
      - name: Report the Gitleaks version
        run: gitleaks version
      - name: Run the repository security command
        run: gitleaks git --no-banner --redact=100 --exit-code 1 .
