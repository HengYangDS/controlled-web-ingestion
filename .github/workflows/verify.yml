name: Verify

on:
  push:
    branches:
      - main
      - candidate/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-contracts:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          enable-cache: true
      - name: Run owner verification commands
        env:
          UV_NO_MANAGED_PYTHON: "1"
          UV_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/uv
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/build/runtime/venv/python-${{ matrix.python-version }}
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          uv run --locked --python python python --version
          uv --version
          uv run --locked --python python python tools/ci/run_tests.py --python python
          uv run --locked --python python python tools/ci/validate_schemas.py
          uv run --locked --python python python tools/ci/check_documentation.py
          uv run --locked --python python python tools/ci/check_source_topology.py

  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run pinned Gitleaks action and repository security command
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.0"
      - name: Run the repository security command
        run: |
          set -euo pipefail
          gitleaks version
          gitleaks git --no-banner --redact=100 --exit-code 1 .
