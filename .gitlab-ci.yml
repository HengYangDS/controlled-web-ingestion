stages:
  - verify

python-contracts:
  stage: verify
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
  image: "python:${PYTHON_VERSION}-slim"
  variables:
    UV_NO_MANAGED_PYTHON: "1"
    UV_PROJECT_ENVIRONMENT: "$CI_PROJECT_DIR/.venv"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - python -m pip install --no-cache-dir "uv==0.11.28"
  script:
    - uv run --locked --python python python tools/ci/run_tests.py --python python
    - uv run --locked --python python python tools/ci/validate_schemas.py
    - uv run --locked --python python python tools/ci/check_documentation.py
    - uv run --locked --python python python tools/ci/check_source_topology.py

security:
  stage: verify
  image:
    name: "zricethezav/gitleaks:v8.30.0"
    entrypoint: [""]
  script:
    - sh tools/ci/run_security_checks.sh

# Explicit runtime Firecrawl validation is omitted from hosted CI. It needs
# reviewed local GHCR identities and must prove loopback teardown rather than
# borrow shared runner Docker state.
