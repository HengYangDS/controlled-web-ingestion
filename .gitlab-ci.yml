workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "push" && $CI_PIPELINE_SOURCE != "web"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        WIB_CI_RUNNER_TAG: ci-linux-arm64-container-protected
    - variables:
        WIB_CI_RUNNER_TAG: ci-linux-arm64-container
stages:
  - verify
default:
  tags:
    - $WIB_CI_RUNNER_TAG
.python-contracts:
  stage: verify
  variables:
    UV_PYTHON_DOWNLOADS: never
    UV_CACHE_DIR: /cache/uv
    UV_LINK_MODE: copy
    UV_HTTP_RETRIES: "10"
    UV_HTTP_TIMEOUT: "120"
    UV_CONCURRENT_DOWNLOADS: "8"
  script:
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/run_tests.py
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/validate_schemas.py
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/check_documentation.py
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/check_source_topology.py
python 3.12:
  extends: .python-contracts
  image: ghcr.io/astral-sh/uv:0.13.6-python3.12-trixie@sha256:101820b96a31d3438aab226230bc5516d62c6b5b506f0e2d72cb4b6975e27dea
  variables:
    PYTHON_VERSION: "3.12"
python 3.13:
  extends: .python-contracts
  image: ghcr.io/astral-sh/uv:0.13.6-python3.13-trixie@sha256:b72353db9e2060a798f2920910d453e96370eb0078ba79eee7c3befa90d255fb
  variables:
    PYTHON_VERSION: "3.13"
python 3.14:
  extends: .python-contracts
  image: ghcr.io/astral-sh/uv:0.13.6-python3.14-trixie@sha256:69acf868b6e856281be85e6088b6e3bde4e46cd83cfd578dbe159076a2920322
  variables:
    PYTHON_VERSION: "3.14"
security:
  stage: verify
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint:
      - ""
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks version
    - gitleaks git --no-banner --redact=100 --exit-code 1 .
