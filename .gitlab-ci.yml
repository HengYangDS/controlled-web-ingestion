workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "push" && $CI_PIPELINE_SOURCE != "web"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        WIB_CI_RUNNER_TAG: ci-linux-arm64-container-protected
    - variables:
        WIB_CI_RUNNER_TAG: ci-linux-arm64-container
stages:
  - verify
default:
  tags:
    - $WIB_CI_RUNNER_TAG
.python-contracts:
  stage: verify
  variables:
    UV_PYTHON_DOWNLOADS: never
    UV_CACHE_DIR: /cache/uv
    UV_LINK_MODE: copy
    UV_HTTP_RETRIES: "10"
    UV_HTTP_TIMEOUT: "120"
    UV_CONCURRENT_DOWNLOADS: "8"
  script:
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/run_tests.py
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/validate_schemas.py
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/check_documentation.py
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/check_source_topology.py
python 3.12:
  extends: .python-contracts
  image: ghcr.io/astral-sh/uv:0.13.7-python3.12-trixie@sha256:2cd2db9a96f7036629ff5427e2769030dd1314bb6522a2e0999bad3f45e1dc9e
  variables:
    PYTHON_VERSION: "3.12"
python 3.13:
  extends: .python-contracts
  image: ghcr.io/astral-sh/uv:0.13.7-python3.13-trixie@sha256:6299696d13e91e9d58e910fca4e503e89f217229a2c4c840a11b367dc24816f4
  variables:
    PYTHON_VERSION: "3.13"
python 3.14:
  extends: .python-contracts
  image: ghcr.io/astral-sh/uv:0.13.7-python3.14-trixie@sha256:9335539f5fb873b1d0b0aa1885dcd2ce3cea8473d9c47c5f24ce2e00fd3a158f
  variables:
    PYTHON_VERSION: "3.14"
security:
  stage: verify
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint:
      - ""
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks version
    - gitleaks git --no-banner --redact=100 --exit-code 1 .
