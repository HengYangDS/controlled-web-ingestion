workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "push" && $CI_PIPELINE_SOURCE != "web"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        WIB_CI_RUNNER_TAG: ci-linux-arm64-container-protected
    - variables:
        WIB_CI_RUNNER_TAG: ci-linux-arm64-container
stages:
  - verify
default:
  tags:
    - $WIB_CI_RUNNER_TAG
.python-contracts:
  stage: verify
  variables:
    UV_PYTHON_DOWNLOADS: never
    UV_CACHE_DIR: /cache/uv
    UV_LINK_MODE: copy
    UV_HTTP_RETRIES: "10"
    UV_HTTP_TIMEOUT: "120"
    UV_CONCURRENT_DOWNLOADS: "8"
    UV_PROJECT_ENVIRONMENT: $CI_PROJECT_DIR/build/runtime/venv/python-${PYTHON_VERSION}
  script:
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/run_tests.py
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/validate_schemas.py
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/check_documentation.py
    - uv run --locked --python "python${PYTHON_VERSION}" python tools/ci/check_source_topology.py
python 3.12:
  extends: .python-contracts
  image: ghcr.io/astral-sh/uv:0.13.4-python3.12-trixie@sha256:62b4b66ebb8e2b59f09307693a12732eb56eca8b13a951a2da536dfed9ac5c55
  variables:
    PYTHON_VERSION: "3.12"
python 3.13:
  extends: .python-contracts
  image: ghcr.io/astral-sh/uv:0.13.4-python3.13-trixie@sha256:d6b4d13b4d926ca0deb4f1bc454aaa7e3bbb02ce1929ec1bd2e94a18c47ad757
  variables:
    PYTHON_VERSION: "3.13"
python 3.14:
  extends: .python-contracts
  image: ghcr.io/astral-sh/uv:0.13.4-python3.14-trixie@sha256:81ff59d597a2483d6dfa5a65bf4e021f6e9df8aa68dd6fa3ab5052d2d76fc97b
  variables:
    PYTHON_VERSION: "3.14"
security:
  stage: verify
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint:
      - ""
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks version
    - gitleaks git --no-banner --redact=100 --exit-code 1 .
