# ETHOS repository binding manifest — the adopter entrypoint.
#
# This minimal profile makes the repository a recognized ETHOS adopter, so `ethos
# prove` uses the adopter proof floor instead of the product-core floor. Extend it
# for your stack; see docs/governance/repository-profile-contract.md.
profile_id = "controlled-web-ingestion"

[openspec]
material_paths = [
  "evidence/verification/**",
  "evidence/claims/**",
  "docs/evidence/**",
  "docs/history/**",
  "docs/reference/**",
  "docs/plans/**",
  "docs/decisions/**",
  ".ethos/profile.toml",
  ".ethos/workspace.toml",
  "tests/contract/**",
  "openspec/**",
]

# Native gates remain repository-owned; ETHOS only compiles and records them.
[proof]
code_correctness_gates = [
  "controlled-web-ingestion-tests",
  "controlled-web-ingestion-static",
  "controlled-web-ingestion-schemas",
  "controlled-web-ingestion-docs",
  "controlled-web-ingestion-security",
  "controlled-web-ingestion-behavior",
  "controlled-web-ingestion-code-analysis",
  "controlled-web-ingestion-format-documents",
  "controlled-web-ingestion-format-toml",
  "controlled-web-ingestion-format-python",
]

[proof.code_correctness_map]
behavior = "controlled-web-ingestion-behavior"
static-analysis = "controlled-web-ingestion-code-analysis"

[[proof.gates]]
id = "controlled-web-ingestion-tests"
kind = "test"
command = ["uv", "run", "--locked", "--offline", "python", "tools/ci/run_tests.py"]
dimensions = ["test", "unit", "contract", "integration"]
execution_mode = "subprocess"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"

[[proof.gates]]
id = "controlled-web-ingestion-static"
kind = "lint"
command = ["uv", "run", "--locked", "--offline", "python", "tools/ci/check_source_topology.py"]
dimensions = ["architecture", "import-discipline"]
execution_mode = "subprocess"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"

[[proof.gates]]
id = "controlled-web-ingestion-schemas"
kind = "schema"
command = ["uv", "run", "--locked", "--offline", "python", "tools/ci/validate_schemas.py"]
dimensions = ["schema", "redaction"]
execution_mode = "subprocess"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"

[[proof.gates]]
id = "controlled-web-ingestion-docs"
kind = "documentation"
command = ["uv", "run", "--locked", "--offline", "python", "tools/ci/check_documentation.py"]
dimensions = ["documentation", "topology"]
execution_mode = "subprocess"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"

[[proof.gates]]
id = "controlled-web-ingestion-security"
kind = "security"
command = ["gitleaks", "git", "--no-banner", "--redact=100", "--exit-code", "1", "."]
dimensions = ["security", "secrets"]
execution_mode = "subprocess"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"

[[proof.gates]]
id = "controlled-web-ingestion-behavior"
kind = "test"
providers = ["ethos.adapters.gates.code_quality:behavior_report"]
dimensions = ["behavior"]
evidence_class = "proof"
trust_bearing = true
network_policy = "offline"

[[proof.gates]]
id = "controlled-web-ingestion-code-analysis"
kind = "lint"
providers = ["ethos.adapters.gates.code_quality:static_report"]
dimensions = ["static-analysis"]
evidence_class = "contract"
trust_bearing = true
network_policy = "offline"

# The paradigm formatters run from the host installation, as gitleaks does.
[[proof.gates]]
id = "controlled-web-ingestion-format-documents"
kind = "lint"
command = [
  "prettier",
  "--config",
  ".config/checks/prettier/prettier.toml",
  "--ignore-path",
  ".gitignore",
  "--ignore-path",
  ".config/checks/prettier/prettierignore",
  "--check",
  "**/*.{md,yaml,yml}",
]
dimensions = ["format"]
execution_mode = "subprocess"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "repository-native"
writes_files = false
network_policy = "offline"

[[proof.gates]]
id = "controlled-web-ingestion-format-toml"
kind = "lint"
command = ["taplo", "fmt", "--config", ".config/checks/taplo/taplo.toml", "--check"]
dimensions = ["format"]
execution_mode = "subprocess"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "repository-native"
writes_files = false
network_policy = "offline"

[[proof.gates]]
id = "controlled-web-ingestion-format-python"
kind = "lint"
command = [
  "ruff",
  "format",
  "--config",
  ".config/checks/ruff/ruff.toml",
  "--no-cache",
  "--check",
  ".",
]
dimensions = ["format"]
execution_mode = "subprocess"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "repository-native"
writes_files = false
network_policy = "offline"
