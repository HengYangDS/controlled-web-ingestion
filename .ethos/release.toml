[release]
version_source = "pyproject.toml"
tag_pattern = "v{version}"

[publication]
local_verification_command = "uv run --locked python tools/ci/run_tests.py"
local_installation_command = "uv run --locked web-ingest --help"

[[publication.peers]]
id = "gitlab"
provider = "gitlab"
role = "organization_collaboration"
git_remote = "gitlab"
forge_repository = "http://192.168.64.101:18086/dig/research/knowledge-systems/controlled-web-ingestion"
capabilities = ["repository", "ci_cd", "publication"]
ci_surface = ".gitlab-ci.yml"

[[publication.peers]]
id = "github"
provider = "github"
role = "public_distribution"
git_remote = "github"
forge_repository = "https://github.com/HengYangDS/controlled-web-ingestion"
capabilities = ["repository", "ci_cd", "publication"]
ci_surface = ".github/workflows/verify.yml"

[attestation]
formats = ["in-toto", "slsa", "spdx-lite"]
