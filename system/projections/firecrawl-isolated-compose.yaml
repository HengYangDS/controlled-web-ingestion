name: web-ingestion-firecrawl-bench

# Every image is the reviewed object that system/supply-chain/firecrawl-provenance.json
# names by digest. Runs never pull; `docker compose pull` acquires exactly these objects.
services:
  redis:
    image: docker.io/library/redis@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    pull_policy: never
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  rabbitmq:
    image: docker.io/library/rabbitmq@sha256:2cb43283d8bbd3caa6c0f0dc00e96c8de772df33df7fd8af6aee4d605aeb8ada
    pull_policy: never
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s
    mem_limit: 1g

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service@sha256:3f21958ad289a7c7ed7d1f2598847a37582d723559e4efb7069d1754ac009852
    pull_policy: never
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: "1"
      BLOCK_MEDIA: "true"
    networks: [backend]
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=512m

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres@sha256:ee30cebf9afb6648f5406ac3e7505e21be30fd2f11c2067bd98a53e7542ecbac
    pull_policy: never
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    networks: [backend]
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=512m
    healthcheck:
      # Initialization serves only the Unix socket, so a TCP probe waits for the final server.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--dbname", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g

  api:
    image: ghcr.io/firecrawl/firecrawl@sha256:e6860ab406e738b632cc41b02a54085575909a1da1fbe4b3577b8339257fee70
    pull_policy: never
    command: ["node", "dist/src/harness.js", "--start-docker"]
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      ENV: "local"
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      BULL_AUTH_KEY: ${BULL_AUTH_KEY}
      # Firecrawl 2.10.19's harness reads this documented runtime knob and
      # launches exactly one NuQ scrape worker. The request adapter also sets
      # maxConcurrency=1, so the service and request layers agree.
      NUQ_WORKER_COUNT: "1"
      HARNESS_STARTUP_TIMEOUT_MS: "90000"
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OLLAMA_BASE_URL: ""
      PROXY_SERVER: ""
      PROXY_USERNAME: ""
      PROXY_PASSWORD: ""
      SEARXNG_ENDPOINT: ""
      NUQ_BACKEND: ""
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
      playwright-service:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3002/').then(() => process.exit(0), () => process.exit(1))
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    ports:
      - 127.0.0.1:13002:3002
    networks: [backend]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 4g

networks:
  backend: {}
